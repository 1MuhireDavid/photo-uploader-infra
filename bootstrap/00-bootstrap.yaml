AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  ProjectName:
    Type: String
    Default: photo-uploader

  GitHubOrg:
    Type: String

  InfraRepoName:
    Type: String
    Default: photo-uploader-infra

  AppRepoName:
    Type: String
    Default: photo-uploader-app

  AllowedGitRef:
    Type: String
    Default: "refs/heads/main"

  InfraPackagingWorkflowFile:
    Type: String
    Default: package-templates.yml

  AppBuildWorkflowFile:
    Type: String
    Default: build-and-push.yml

  CreateOidcProvider:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  ShouldCreateOidcProvider: !Equals
    - !Ref CreateOidcProvider
    - "true"

Resources:

  TemplatesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-cfn-templates-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldTemplateVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-Bootstrap

  TemplatesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TemplatesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TemplatesBucket.Arn
              - !Sub "${TemplatesBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          - Sid: AllowAccountPrincipalsReadTemplates
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "s3:GetObject"
            Resource: !Sub "${TemplatesBucket.Arn}/templates/*"

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  InfraPackagingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-gha-infra-packaging-role"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
                "token.actions.githubusercontent.com:repository": !Sub "${GitHubOrg}/${InfraRepoName}"
                "token.actions.githubusercontent.com:ref": !Ref AllowedGitRef
                "token.actions.githubusercontent.com:job_workflow_ref": !Sub "${GitHubOrg}/${InfraRepoName}/.github/workflows/${InfraPackagingWorkflowFile}@${AllowedGitRef}"
      Policies:
        - PolicyName: PutNestedTemplates
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action:
                  - "s3:ListBucket"
                Resource: !GetAtt TemplatesBucket.Arn
              - Sid: ReadWriteTemplateObjects
                Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:GetObject"
                Resource: !Sub "${TemplatesBucket.Arn}/templates/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AppRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${ProjectName}-app"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images older than 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-app"
        - Key: Project
          Value: !Ref ProjectName

  AppEcrPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-gha-ecr-push-role"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
                "token.actions.githubusercontent.com:repository": !Sub "${GitHubOrg}/${AppRepoName}"
                "token.actions.githubusercontent.com:ref": !Ref AllowedGitRef
                "token.actions.githubusercontent.com:job_workflow_ref": !Sub "${GitHubOrg}/${AppRepoName}/.github/workflows/${AppBuildWorkflowFile}@${AllowedGitRef}"
      Policies:
        - PolicyName: EcrPushOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: "ecr:GetAuthorizationToken"
                Resource: "*"
              - Sid: EcrPushToSingleRepo
                Effect: Allow
                Action:
                  - "ecr:BatchCheckLayerAvailability"
                  - "ecr:PutImage"
                  - "ecr:InitiateLayerUpload"
                  - "ecr:UploadLayerPart"
                  - "ecr:CompleteLayerUpload"
                  - "ecr:BatchGetImage"
                  - "ecr:DescribeImages"
                  - "ecr:DescribeRepositories"
                Resource: !GetAtt AppRepository.Arn
        - PolicyName: UploadDeployTemplates
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PutDeployTemplatesZip
                Effect: Allow
                Action: "s3:PutObject"
                Resource: !Sub "arn:aws:s3:::${ProjectName}-pipeline-${AWS::AccountId}-${AWS::Region}/deploy-templates/*"
        - PolicyName: ReadRootStackOutputs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeRootStack
                Effect: Allow
                Action: "cloudformation:DescribeStacks"
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  TemplatesBucketName:
    Value: !Ref TemplatesBucket
    Export:
      Name: !Sub "${ProjectName}-templates-bucket"

  EcrRepositoryUri:
    Value: !GetAtt AppRepository.RepositoryUri
    Export:
      Name: !Sub "${ProjectName}-ecr-repository-uri"

  EcrRepositoryName:
    Value: !Ref AppRepository
    Export:
      Name: !Sub "${ProjectName}-ecr-repository-name"

  EcrRepositoryArn:
    Value: !GetAtt AppRepository.Arn
    Export:
      Name: !Sub "${ProjectName}-ecr-repository-arn"

  InfraPackagingRoleArn:
    Value: !GetAtt InfraPackagingRole.Arn

  AppEcrPushRoleArn:
    Value: !GetAtt AppEcrPushRole.Arn
