# CloudFormation Git sync "deployment file" for the BOOTSTRAP stack.
#
# This is a SEPARATE Git sync stack from cfn/deployment-file.yaml's --
# two independent Git sync setups in the CloudFormation console, each
# watching its own template + deployment file in this same repo:
#   bootstrap/00-bootstrap.yaml + bootstrap/deployment-file.yaml  (this stack)
#   cfn/root.yaml              + cfn/deployment-file.yaml          (the root stack)
#
# Unlike the root stack, this one needs a CUSTOM stack execution role
# (not the console's auto-generated one) -- bootstrap creates/manages IAM
# roles, an IAM OIDC provider, an S3 bucket, and an ECR repository, which
# the auto-generated role isn't scoped for. See the README section on
# migrating bootstrap to Git sync for the exact trust policy + permissions
# policy to create that role with, before turning on Git sync here.
#
# `template-file-path` below is resolved by Git sync RELATIVE TO THE REPO
# ROOT, not relative to this file's own directory.
#
# Docs: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/git-sync-concepts-terms.html

template-file-path: bootstrap/00-bootstrap.yaml

parameters:
  # Must match the ProjectName cfn/deployment-file.yaml deploys the root
  # stack with -- root.yaml resolves TemplatesBucketName and the
  # EcrRepository* values from this stack's Exports via Fn::ImportValue.
  ProjectName: photo-uploader

  GitHubOrg: 1MuhireDavid
  InfraRepoName: photo-uploader-infra
  AppRepoName: photo-uploader-app
  AllowedGitRef: refs/heads/main
  InfraPackagingWorkflowFile: package-templates.yml
  AppBuildWorkflowFile: build-and-push.yml

  # "false" -- the token.actions.githubusercontent.com OIDC provider
  # already exists in this account. Only set "true" if IAM > Identity
  # providers ever shows none registered for GitHub.
  CreateOidcProvider: "false"

tags:
  Project: photo-uploader
  ManagedBy: CloudFormation-GitSync
  Environment: lab
  Owner: DAVID MUHIRE
