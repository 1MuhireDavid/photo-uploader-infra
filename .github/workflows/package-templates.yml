name: Package nested templates to S3

on:
  push:
    branches: [main]
    paths:
      - "cfn/nested-templates/**"
      - "cfn/root.yaml"

permissions:
  id-token: write
  contents: write

concurrency:
  group: package-templates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint templates
        run: |
          set -euo pipefail
          pip install --quiet cfn-lint
          cfn-lint cfn/nested-templates/*.yaml
          cfn-lint cfn/root.yaml --ignore-checks W3002 W6001

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_PACKAGING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p cfn/packaged
          aws cloudformation package \
            --template-file cfn/root.yaml \
            --s3-bucket "${{ vars.AWS_TEMPLATES_BUCKET }}" \
            --s3-prefix templates \
            --output-template-file cfn/packaged/root.yaml
          cfn-lint cfn/packaged/root.yaml --ignore-checks W6001

      - name: Push packaged template
        run: |
          set -euo pipefail
          git add cfn/packaged/root.yaml
          if git diff --cached --quiet; then
            echo "Unchanged - nothing to push."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: package nested templates [skip ci]"
          git push
