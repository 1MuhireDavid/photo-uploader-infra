name: "Package nested templates to S3"

# This workflow does NOT deploy anything itself. Its only job is to get
# nested-stack template bodies into the S3 bucket that root.yaml's
# TemplateURL properties point at, then nudge Git sync (by bumping
# TemplatesVersion in deployment-file.yaml) so CloudFormation notices.
# Actual deployment stays 100% owned by CloudFormation Git sync.
on:
  push:
    branches: [main]
    paths:
      - "cfn/modules/**"
      - "cfn/root.yaml"

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: write    # required to commit the version bump back

concurrency:
  group: package-templates
  cancel-in-progress: false

jobs:
  package-and-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TEMPORARY debug step -- prints the actual OIDC token claims GitHub
      # is issuing, plus which role ARN/region the workflow resolved from
      # secrets/vars (partially masked). Helps diagnose AssumeRoleWithWebIdentity
      # "Not authorized" errors that aren't explained by the role's trust
      # policy itself (e.g. org-level OIDC subject-claim customization).
      # Remove this step once the OIDC auth issue is resolved.
      - name: Debug OIDC token claims
        env:
          ROLE_ARN: ${{ secrets.AWS_INFRA_PACKAGING_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "Resolved role-to-assume length: ${#ROLE_ARN} chars"
          echo "Resolved role-to-assume (masked): ${ROLE_ARN:0:20}...${ROLE_ARN: -10}"
          echo "Resolved aws-region: '${REGION}'"
          python3 -c "import os,json,base64,urllib.request as u; url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience=sts.amazonaws.com'; token=os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']; req=u.Request(url, headers={'Authorization':'bearer '+token}); jwt=json.load(u.urlopen(req))['value']; payload=jwt.split('.')[1]; payload+='='*(-len(payload)%4); claims=json.loads(base64.urlsafe_b64decode(payload)); keys=['sub','aud','repository','repository_owner','ref','job_workflow_ref','workflow_ref','event_name']; print(json.dumps({k: claims.get(k) for k in keys}, indent=2))"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_PACKAGING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Compute template version (short SHA)
        id: version
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload nested templates to S3
        run: |
          aws s3 cp "cfn/modules/" \
            "s3://${{ secrets.AWS_TEMPLATES_BUCKET }}/templates/${{ steps.version.outputs.sha }}/" \
            --recursive --exclude "*" --include "*.yaml"

      - name: Bump TemplatesVersion in deployment-file.yaml
        run: |
          sed -i \
            "s/^  TemplatesVersion:.*/  TemplatesVersion: ${{ steps.version.outputs.sha }}/" \
            "cfn/deployment-file.yaml"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "cfn/deployment-file.yaml"
          if ! git diff --cached --quiet; then
            git commit -m "chore: point Git sync at templates ${{ steps.version.outputs.sha }} [skip ci]"
            git push
          else
            echo "No version change to commit."
          fi
