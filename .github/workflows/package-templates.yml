name: "Package nested templates to S3"

# This workflow does NOT deploy anything itself, and does NOT touch
# deployment-file.yaml. Its only job is to get nested-stack template
# bodies into the S3 bucket that root.yaml's TemplateURL properties
# point at, under a key prefixed with this push's short commit SHA.
#
# Git sync (configured manually in the CloudFormation console) is what
# actually deploys. After this workflow finishes, copy the SHA it printed
# into deployment-file.yaml's TemplatesVersion parameter and commit that
# yourself -- that's the change Git sync picks up to redeploy against the
# templates just uploaded here.
on:
  push:
    branches: [main]
    paths:
      - "cfn/modules/**"
      - "cfn/root.yaml"

permissions:
  id-token: write   # required for OIDC -> AWS

concurrency:
  group: package-templates
  cancel-in-progress: false

jobs:
  package-and-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_PACKAGING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Compute template version (short SHA)
        id: version
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload nested templates to S3
        run: |
          aws s3 cp "cfn/modules/" \
            "s3://${{ secrets.AWS_TEMPLATES_BUCKET }}/templates/${{ steps.version.outputs.sha }}/" \
            --recursive --exclude "*" --include "*.yaml"

      - name: Print next manual step
        run: |
          {
            echo "### Templates uploaded"
            echo ""
            echo "Set this in \`cfn/deployment-file.yaml\` and commit to trigger Git sync:"
            echo ""
            echo '```'
            echo "  TemplatesVersion: ${{ steps.version.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TemplatesVersion: ${{ steps.version.outputs.sha }}"
