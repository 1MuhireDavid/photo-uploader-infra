AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Least-privilege security groups for the Photo Uploader lab. Traffic path
  enforced by SG rules only (defense in depth, no wide-open ingress
  anywhere):
    Internet    -> ALB SG (80 prod, TestListenerPort pre-prod validation)
    ALB SG      -> ECS Task SG (container port only)
    ECS Task SG -> VPC Endpoint SG (443 only, for ECR/logs/STS/Secrets Manager)
    ECS Task SG -> RDS SG (5432 only)

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  VpcCidr:
    Type: String
  ContainerPort:
    Type: Number
    Default: 8080
  DbPort:
    Type: Number
    Default: 5432
  TestListenerPort:
    Type: Number
    Default: 8081
    Description: >
      ALB's pre-production validation listener port (see 06-alb-ecs.yaml's
      TestListener). Kept as wide-open as the prod listener by default
      (TestListenerAllowedCidr) since this is a lab with no VPN/internal
      network to restrict it to -- tighten TestListenerAllowedCidr to your
      own IP/office CIDR in a real environment, since this listener can
      briefly serve an unvalidated "green" build.
  TestListenerAllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach TestListenerPort. Restrict this in a non-lab environment.

Resources:

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ALB - allows inbound HTTP from the internet only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from internet (prod listener)
        - IpProtocol: tcp
          FromPort: !Ref TestListenerPort
          ToPort: !Ref TestListenerPort
          CidrIp: !Ref TestListenerAllowedCidr
          Description: Pre-production validation listener (CodeDeploy test traffic route)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          CidrIp: !Ref VpcCidr
          Description: Only to ECS tasks on the container port
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-sg"

  EcsTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Fargate tasks - accepts traffic from the ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: App traffic from ALB only
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS egress (ECR/logs/STS/Secrets Manager/S3 via VPC endpoints only -- no NAT Gateway in this VPC, so 0.0.0.0/0 here is scoped by routing, not by this rule)
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ecs-task-sg"

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface VPC endpoints - accepts HTTPS from ECS tasks only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref EcsTaskSecurityGroup   # vpc cidr 
          Description: HTTPS from ECS tasks only
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpce-sg"

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL - accepts traffic from ECS tasks only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref DbPort
          ToPort: !Ref DbPort
          SourceSecurityGroupId: !Ref EcsTaskSecurityGroup
          Description: PostgreSQL from ECS tasks only
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-rds-sg"

  # Added after EcsTaskSecurityGroup + RdsSecurityGroup both exist -- a
  # security group can't reference itself as an egress target for a rule
  # naming a *different* group until that group is created, so this rule
  # is declared separately rather than inline above.
  EcsTaskToRdsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EcsTaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref DbPort
      ToPort: !Ref DbPort
      DestinationSecurityGroupId: !Ref RdsSecurityGroup
      Description: PostgreSQL to RDS only

Outputs:
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
  EcsTaskSecurityGroupId:
    Value: !Ref EcsTaskSecurityGroup
  VpcEndpointSecurityGroupId:
    Value: !Ref VpcEndpointSecurityGroup
  RdsSecurityGroupId:
    Value: !Ref RdsSecurityGroup
