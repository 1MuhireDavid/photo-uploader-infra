AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deployment pipeline: EventBridge detects a new image PUSH to ECR and
  starts CodePipeline. CodePipeline pulls (1) the image reference from ECR
  and (2) the appspec.yaml/taskdef.json deployment templates, zipped up
  and uploaded to S3 by the separate photo-uploader-app repo's build
  workflow, then hands both to CodeDeploy, which performs a blue/green
  ECS deployment (traffic shifted from the "blue" target group to
  "green").

Parameters:
  ProjectName:
    Type: String
  EcrRepositoryName:
    Type: String
  EcrRepositoryArn:
    Type: String
  ClusterName:
    Type: String
  ServiceName:
    Type: String
  ProdListenerArn:
    Type: String
  BlueTargetGroupName:
    Type: String
  GreenTargetGroupName:
    Type: String
  # Path, relative to the app repo root, that holds appspec.yaml and
  # taskdef.json (used only for the object's internal zip layout / the
  # CodeDeploy action's TemplatePath below).
  DeployTemplatesPath:
    Type: String
    Default: ecs
  DeployTemplatesS3Key:
    Type: String
    Default: deploy-templates/deploy-templates.zip
    Description: >
      Key, inside ArtifactBucket, that the app repo's build workflow
      uploads its ecs/appspec.yaml + ecs/taskdef.json zip to. Must match
      the key that workflow uploads to.
  DeployedImageTag:
    Type: String
    Default: latest
    Description: >
      Mutable tag the app build workflow always pushes last. This is the
      tag EventBridge/CodePipeline pick up as "the newest version."

Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Kept short deliberately: ProjectName + this suffix + account id +
      # the longest AWS region name must still fit under S3's 63-char
      # bucket name limit.
      BucketName: !Sub "${ProjectName}-pipeline-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  # ------------------------------ CodeDeploy ------------------------------
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codedeploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codedeploy.amazonaws.com }
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${ProjectName}-app"
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub "${ProjectName}-dg"
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 10
      ECSServices:
        - ClusterName: !Ref ClusterName
          ServiceName: !Ref ServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns: [!Ref ProdListenerArn]
            TargetGroups:
              - Name: !Ref BlueTargetGroupName
              - Name: !Ref GreenTargetGroupName

  # ------------------------------ CodePipeline ------------------------------
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codepipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucketAccess
                Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject", "s3:GetBucketVersioning"]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: EcrSourceAction
                Effect: Allow
                Action:
                  - "ecr:DescribeImages"
                  - "ecr:GetDownloadUrlForLayer"
                  - "ecr:BatchGetImage"
                Resource: !Ref EcrRepositoryArn
              - Sid: CodeDeployTrigger
                Effect: Allow
                Action:
                  - "codedeploy:CreateDeployment"
                  - "codedeploy:GetApplication"
                  - "codedeploy:GetDeployment"
                  - "codedeploy:GetDeploymentConfig"
                  - "codedeploy:GetApplicationRevision"
                  - "codedeploy:RegisterApplicationRevision"
                Resource: "*"
              - Sid: RegisterTaskDefinitionForDeploy
                Effect: Allow
                Action:
                  # RegisterTaskDefinition/DeregisterTaskDefinition don't
                  # support resource-level restriction (the new revision
                  # ARN doesn't exist yet at call time), hence Resource: "*"
                  # rather than scoping to the family ARN.
                  - "ecs:RegisterTaskDefinition"
                  - "ecs:DescribeTaskDefinition"
                  - "ecs:DeregisterTaskDefinition"
                Resource: "*"
              - Sid: PassRolesToEcs
                Effect: Allow
                Action: "iam:PassRole"
                Resource: "*"
                Condition:
                  StringEqualsIfExists:
                    "iam:PassedToService": "ecs-tasks.amazonaws.com"

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline"
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: ImageSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: "1"
              Configuration:
                RepositoryName: !Ref EcrRepositoryName
                ImageTag: !Ref DeployedImageTag
              OutputArtifacts: [{ Name: ImageDetail }]
              RunOrder: 1
            - Name: DeployTemplatesSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket: !Ref ArtifactBucket
                S3ObjectKey: !Ref DeployTemplatesS3Key
                # false, deliberately: the ECR PUSH EventBridge rule is the
                # only intended trigger for this pipeline. This action still
                # pulls whatever is currently at that S3 key every time the
                # pipeline runs -- PollForSourceChanges just controls
                # whether IT can also start a run on every new zip upload.
                PollForSourceChanges: "false"
              OutputArtifacts: [{ Name: DeployTemplates }]
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              InputArtifacts:
                - { Name: ImageDetail }
                - { Name: DeployTemplates }
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: DeployTemplates
                TaskDefinitionTemplatePath: !Sub "${DeployTemplatesPath}/taskdef.json"
                AppSpecTemplateArtifact: DeployTemplates
                AppSpecTemplatePath: !Sub "${DeployTemplatesPath}/appspec.yaml"
                Image1ArtifactName: ImageDetail
                Image1ContainerName: IMAGE1_NAME
              RunOrder: 1

  # ------------------------- EventBridge trigger ---------------------------
  EventBridgeInvokePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-eventbridge-pipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "codepipeline:StartPipelineExecution"
                Resource: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"

  EcrPushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-ecr-push-rule"
      Description: !Sub "Starts ${ProjectName}-pipeline whenever a new '${DeployedImageTag}' image is pushed to ECR"
      EventPattern:
        source: ["aws.ecr"]
        detail-type: ["ECR Image Action"]
        detail:
          action-type: ["PUSH"]
          result: ["SUCCESS"]
          repository-name: [!Ref EcrRepositoryName]
          image-tag: [!Ref DeployedImageTag]
      Targets:
        - Id: TriggerCodePipeline
          Arn: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt EventBridgeInvokePipelineRole.Arn

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication
  CodeDeployDeploymentGroupName:
    Value: !Ref CodeDeployDeploymentGroup
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Description: >-
      Give this to the app repo's build workflow (as the
      PIPELINE_ARTIFACT_BUCKET variable) -- it uploads its zipped
      ecs/appspec.yaml + ecs/taskdef.json here for the DeployTemplatesSource
      action to pick up.
