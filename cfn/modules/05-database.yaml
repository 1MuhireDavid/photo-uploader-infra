AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RDS PostgreSQL instance for photo metadata (descriptions), in the private
  subnets alongside ECS. The master credential is entirely RDS-managed
  (ManageMasterUserPassword) -- it is generated and rotated by AWS Secrets
  Manager, and never appears in this template, a parameter, or a
  deployment-file.yaml value.

Parameters:
  ProjectName:
    Type: String
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  DbName:
    Type: String
    Default: photogallery
  DbMasterUsername:
    Type: String
    Default: photoapp
  DbMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      "false" keeps this lab cheap (the rubric requires a multi-AZ VPC,
      not a multi-AZ database). Set "true" for production-grade failover.
  DbPort:
    Type: Number
    Default: 5432

Resources:

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} private subnets (2 AZ) for RDS"
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db-subnet-group"

  Database:
    Type: AWS::RDS::DBInstance
    # Lab teardown hygiene: no snapshot/replica left behind (and no
    # matching storage cost) when the stack is deleted. A production
    # deployment should use DeletionPolicy: Snapshot instead.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: postgres
      # EngineVersion intentionally omitted: AWS provisions the current
      # default supported PostgreSQL version for this engine at create
      # time, so this template never goes stale as versions are deprecated.
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Ref DbMasterUsername
      ManageMasterUserPassword: true
      Port: !Ref DbPort
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref RdsSecurityGroupId]
      MultiAZ: !Ref DbMultiAZ
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"

Outputs:
  DbEndpointAddress:
    Value: !GetAtt Database.Endpoint.Address
  DbPort:
    Value: !GetAtt Database.Endpoint.Port
  DbName:
    Value: !Ref DbName
  DbSecretArn:
    Description: RDS-managed Secrets Manager secret holding {username, password}
    Value: !GetAtt Database.MasterUserSecret.SecretArn
