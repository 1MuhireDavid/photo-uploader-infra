# CloudFormation Git sync "deployment file".
#
# This is the file Git sync actually watches for changes (together with
# the template it points to). When you first turn on Git sync in the
# console you can either supply this file yourself (recommended -- it's
# reviewable, versioned application config) or let Git sync generate one
# for you as a pull request. If AWS's generated schema differs slightly
# from below by the time you set this up, accept AWS's PR once and diff
# it against this file rather than fighting the console.
#
# When you turn on Git sync in the console, point it at this file's path
# within THIS repo (photo-uploader-infra):
#   cfn/deployment-file.yaml
# `template-file-path` below is resolved by Git sync RELATIVE TO THE REPO
# ROOT, not relative to this file's own directory.
#
# Docs: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/git-sync-concepts-terms.html
#
# NOTE: the deployment file schema is only template-file-path/parameters/tags
# -- there's no stack-name or capabilities field. The stack name and the
# IAM-capability acknowledgment are both set in the console when
# configuring Git sync for this stack, not in this file.

template-file-path: cfn/root.yaml

parameters:
  # Must match the ProjectName the bootstrap stack (bootstrap/00-bootstrap.yaml)
  # was deployed with -- root.yaml resolves TemplatesBucketName and the
  # EcrRepository* values from bootstrap's CloudFormation Exports (named
  # "${ProjectName}-templates-bucket" etc.) automatically, via
  # Fn::ImportValue. There's nothing to copy-paste for those here anymore;
  # a ProjectName mismatch between the two stacks is the only way this
  # wiring breaks (fails stack creation with "No export named ... found").
  ProjectName: photo-uploader

  # Set this MANUALLY after each run of .github/workflows/package-templates.yml
  # -- copy the short SHA it prints (job summary + logs) in here and commit,
  # which is the change Git sync picks up to redeploy against the templates
  # that run just uploaded to S3.
  TemplatesVersion: 14b21b5be80e

  VpcCIDR: 10.30.0.0/16
  PublicSubnet1CIDR: 10.30.0.0/24
  PublicSubnet2CIDR: 10.30.1.0/24
  PrivateSubnet1CIDR: 10.30.10.0/24
  PrivateSubnet2CIDR: 10.30.11.0/24

  CloudFrontPriceClass: PriceClass_200

  DbInstanceClass: db.t3.micro
  DbAllocatedStorage: 20
  DbName: photogallery
  DbMasterUsername: photoapp
  DbMultiAZ: "false"
  DbPort: 5432

  ContainerPort: 8080
  # ALB listener CodeDeploy points at the "green" candidate for
  # pre-production validation before prod traffic (port 80) shifts to it.
  # 0.0.0.0/0 here matches the lab's prod listener -- restrict
  # TestListenerAllowedCidr to your own IP/office CIDR in a real
  # environment, since this listener can briefly serve an unvalidated build.
  TestListenerPort: 8081
  TestListenerAllowedCidr: 0.0.0.0/0
  # Minutes CodeDeploy waits, after pointing TestListenerPort at a new
  # deployment, for `aws deploy continue-deployment` before stopping and
  # rolling back on its own. See 07-cicd-pipeline.yaml.
  DeploymentReadyWaitMinutes: 30
  # Must already exist in ECR (pushed by the app repo's build workflow)
  # BEFORE this stack is created -- there's no NAT Gateway here to fall
  # back on a public placeholder image.
  InitialImageTag: latest
  TaskCpu: "256"
  TaskMemory: "512"
  MinTasks: 1
  DesiredTasks: 1
  MaxTasks: 4
  CpuTargetPercent: 60

  AppOwnerName: "DAVID MUHIRE"
  LabName: "Photo Uploader Lab"

  DeployedImageTag: latest

tags:
  Project: photo-uploader
  ManagedBy: CloudFormation-GitSync
  Environment: lab
  Owner: DAVID MUHIRE
