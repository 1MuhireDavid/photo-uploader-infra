AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  ProjectName:
    Type: String
    Default: photo-uploader

  NetworkTemplateHash:
    Type: String
  SecurityTemplateHash:
    Type: String
  VpcEndpointsTemplateHash:
    Type: String
  StorageCdnTemplateHash:
    Type: String
  DatabaseTemplateHash:
    Type: String
  AlbEcsTemplateHash:
    Type: String
  CicdPipelineTemplateHash:
    Type: String


  VpcCIDR:
    Type: String
    Default: 10.30.0.0/16
  PublicSubnet1CIDR:
    Type: String
    Default: 10.30.0.0/24
  PublicSubnet2CIDR:
    Type: String
    Default: 10.30.1.0/24
  PrivateSubnet1CIDR:
    Type: String
    Default: 10.30.10.0/24
  PrivateSubnet2CIDR:
    Type: String
    Default: 10.30.11.0/24

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All

  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  DbName:
    Type: String
    Default: photogallery
  DbMasterUsername:
    Type: String
    Default: photoapp
  DbMultiAZ:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  DbPort:
    Type: Number
    Default: 5432

  ContainerPort:
    Type: Number
    Default: 8080
  TestListenerPort:
    Type: Number
    Default: 8081
  TestListenerAllowedCidr:
    Type: String
    Default: 0.0.0.0/0
  DeploymentReadyWaitMinutes:
    Type: Number
    Default: 30
  InitialImageTag:
    Type: String
    Default: latest
  TaskCpu:
    Type: String
    Default: "256"
  TaskMemory:
    Type: String
    Default: "512"
  MinTasks:
    Type: Number
    Default: 1
  DesiredTasks:
    Type: Number
    Default: 1
  MaxTasks:
    Type: Number
    Default: 4
  CpuTargetPercent:
    Type: Number
    Default: 60
  AppOwnerName:
    Type: String
  LabName:
    Type: String
    Default: "Photo Uploader Lab"

  DeployedImageTag:
    Type: String
    Default: latest

Resources:

  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://${TemplatesBucket}.s3.${AWS::Region}.amazonaws.com/templates/01-network-${NetworkTemplateHash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${ProjectName}-templates-bucket"
      Parameters:
        ProjectName: !Ref ProjectName
        VpcCIDR: !Ref VpcCIDR
        PublicSubnet1CIDR: !Ref PublicSubnet1CIDR
        PublicSubnet2CIDR: !Ref PublicSubnet2CIDR
        PrivateSubnet1CIDR: !Ref PrivateSubnet1CIDR
        PrivateSubnet2CIDR: !Ref PrivateSubnet2CIDR
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://${TemplatesBucket}.s3.${AWS::Region}.amazonaws.com/templates/02-security-${SecurityTemplateHash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${ProjectName}-templates-bucket"
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        VpcCidr: !GetAtt NetworkStack.Outputs.VpcCidr
        ContainerPort: !Ref ContainerPort
        DbPort: !Ref DbPort
        TestListenerPort: !Ref TestListenerPort
        TestListenerAllowedCidr: !Ref TestListenerAllowedCidr
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BackingServicesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://${TemplatesBucket}.s3.${AWS::Region}.amazonaws.com/templates/03-vpc-endpoints-${VpcEndpointsTemplateHash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${ProjectName}-templates-bucket"
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        VpcEndpointSecurityGroupId: !GetAtt SecurityStack.Outputs.VpcEndpointSecurityGroupId
        PrivateRouteTableIds: !GetAtt NetworkStack.Outputs.PrivateRouteTableIds
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  StorageCdnStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://${TemplatesBucket}.s3.${AWS::Region}.amazonaws.com/templates/04-storage-cdn-${StorageCdnTemplateHash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${ProjectName}-templates-bucket"
      Parameters:
        ProjectName: !Ref ProjectName
        CloudFrontPriceClass: !Ref CloudFrontPriceClass
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://${TemplatesBucket}.s3.${AWS::Region}.amazonaws.com/templates/05-database-${DatabaseTemplateHash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${ProjectName}-templates-bucket"
      Parameters:
        ProjectName: !Ref ProjectName
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        RdsSecurityGroupId: !GetAtt SecurityStack.Outputs.RdsSecurityGroupId
        DbInstanceClass: !Ref DbInstanceClass
        DbAllocatedStorage: !Ref DbAllocatedStorage
        DbName: !Ref DbName
        DbMasterUsername: !Ref DbMasterUsername
        DbMultiAZ: !Ref DbMultiAZ
        DbPort: !Ref DbPort
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AlbEcsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://${TemplatesBucket}.s3.${AWS::Region}.amazonaws.com/templates/06-alb-ecs-${AlbEcsTemplateHash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${ProjectName}-templates-bucket"
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        AlbSecurityGroupId: !GetAtt SecurityStack.Outputs.AlbSecurityGroupId
        EcsTaskSecurityGroupId: !GetAtt SecurityStack.Outputs.EcsTaskSecurityGroupId
        ContainerPort: !Ref ContainerPort
        TestListenerPort: !Ref TestListenerPort
        RepositoryUri: !ImportValue
          Fn::Sub: "${ProjectName}-ecr-repository-uri"
        InitialImageTag: !Ref InitialImageTag
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        MinTasks: !Ref MinTasks
        DesiredTasks: !Ref DesiredTasks
        MaxTasks: !Ref MaxTasks
        CpuTargetPercent: !Ref CpuTargetPercent
        AppOwnerName: !Ref AppOwnerName
        LabName: !Ref LabName
        PhotosBucketName: !GetAtt StorageCdnStack.Outputs.PhotosBucketName
        PhotosBucketArn: !GetAtt StorageCdnStack.Outputs.PhotosBucketArn
        CloudFrontDomainName: !GetAtt StorageCdnStack.Outputs.CloudFrontDomainName
        DbEndpointAddress: !GetAtt DatabaseStack.Outputs.DbEndpointAddress
        DbPort: !GetAtt DatabaseStack.Outputs.DbPort
        DbName: !GetAtt DatabaseStack.Outputs.DbName
        DbSecretArn: !GetAtt DatabaseStack.Outputs.DbSecretArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CicdPipelineStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://${TemplatesBucket}.s3.${AWS::Region}.amazonaws.com/templates/07-cicd-pipeline-${CicdPipelineTemplateHash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${ProjectName}-templates-bucket"
      Parameters:
        ProjectName: !Ref ProjectName
        EcrRepositoryName: !ImportValue
          Fn::Sub: "${ProjectName}-ecr-repository-name"
        EcrRepositoryArn: !ImportValue
          Fn::Sub: "${ProjectName}-ecr-repository-arn"
        ClusterName: !GetAtt AlbEcsStack.Outputs.ClusterName
        ServiceName: !GetAtt AlbEcsStack.Outputs.ServiceName
        ProdListenerArn: !GetAtt AlbEcsStack.Outputs.ProdListenerArn
        TestListenerArn: !GetAtt AlbEcsStack.Outputs.TestListenerArn
        DeploymentReadyWaitMinutes: !Ref DeploymentReadyWaitMinutes
        BlueTargetGroupName: !GetAtt AlbEcsStack.Outputs.BlueTargetGroupName
        GreenTargetGroupName: !GetAtt AlbEcsStack.Outputs.GreenTargetGroupName
        DeployedImageTag: !Ref DeployedImageTag
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  AlbEndpoint:
    Value: !Sub "http://${AlbEcsStack.Outputs.AlbDnsName}"
  AlbTestEndpoint:
    Value: !Sub "http://${AlbEcsStack.Outputs.AlbDnsName}:${TestListenerPort}"
  EcrRepositoryUri:
    Value: !ImportValue
      Fn::Sub: "${ProjectName}-ecr-repository-uri"
  EcsClusterName:
    Value: !GetAtt AlbEcsStack.Outputs.ClusterName
  EcsServiceName:
    Value: !GetAtt AlbEcsStack.Outputs.ServiceName
  PipelineName:
    Value: !GetAtt CicdPipelineStack.Outputs.PipelineName
  ArtifactBucketName:
    Value: !GetAtt CicdPipelineStack.Outputs.ArtifactBucketName
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId
  PhotosBucketName:
    Value: !GetAtt StorageCdnStack.Outputs.PhotosBucketName
  CloudFrontDomainName:
    Value: !GetAtt StorageCdnStack.Outputs.CloudFrontDomainName
  DbEndpointAddress:
    Value: !GetAtt DatabaseStack.Outputs.DbEndpointAddress
  DbSecretArn:
    Value: !GetAtt DatabaseStack.Outputs.DbSecretArn
