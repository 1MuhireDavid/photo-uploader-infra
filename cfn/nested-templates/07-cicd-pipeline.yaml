AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  ProjectName:
    Type: String
  EcrRepositoryName:
    Type: String
  EcrRepositoryArn:
    Type: String
  ClusterName:
    Type: String
  ServiceName:
    Type: String
  ProdListenerArn:
    Type: String
  TestListenerArn:
    Type: String
  BlueTargetGroupName:
    Type: String
  GreenTargetGroupName:
    Type: String
  DeployTemplatesPath:
    Type: String
    Default: ecs
  DeployTemplatesS3Key:
    Type: String
    Default: deploy-templates/deploy-templates.zip
  DeployedImageTag:
    Type: String
    Default: latest

Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket  # used by codepipeline & workflow uploads deploy-tempalet zips
    Properties:
      BucketName: !Sub "${ProjectName}-pipeline-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  CodeDeployServiceRole:  #assume to perform blue/green shift 
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codedeploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  CodeDeployApplication: #logical code deployment application
    Type: AWS::CodeDeploy::Application  # parent of the deployment group below
    Properties:
      ApplicationName: !Sub "${ProjectName}-app"
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub "${ProjectName}-dg"
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT  #traffic shift once green is healthy
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 10
      ECSServices:
        - ClusterName: !Ref ClusterName
          ServiceName: !Ref ServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !Ref ProdListenerArn
            TestTrafficRoute:
              ListenerArns:
                - !Ref TestListenerArn
            TargetGroups:
              - Name: !Ref BlueTargetGroupName
              - Name: !Ref GreenTargetGroupName

  CodePipelineServiceRole:
    Type: AWS::IAM::Role  #assume to run each stage
    Properties:
      RoleName: !Sub "${ProjectName}-codepipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucketAccess
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                  - "s3:PutObject"
                  - "s3:GetBucketVersioning"
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: EcrSourceAction  #read scoped to ecr repo
                Effect: Allow
                Action:
                  - "ecr:DescribeImages"
                  - "ecr:GetDownloadUrlForLayer"
                  - "ecr:BatchGetImage"
                Resource: !Ref EcrRepositoryArn
              - Sid: EcrAuthToken
                Effect: Allow
                Action: "ecr:GetAuthorizationToken"
                Resource: "*"
              - Sid: CodeDeployTrigger
                Effect: Allow
                Action:
                  - "codedeploy:CreateDeployment"
                  - "codedeploy:GetApplication"
                  - "codedeploy:GetDeployment"
                  - "codedeploy:GetDeploymentConfig"
                  - "codedeploy:GetApplicationRevision"
                  - "codedeploy:RegisterApplicationRevision"
                Resource: "*"
              - Sid: RegisterTaskDefinitionForDeploy
                Effect: Allow
                Action:
                  - "ecs:RegisterTaskDefinition"
                  - "ecs:DescribeTaskDefinition"
                  - "ecs:DeregisterTaskDefinition"
                Resource: "*"
              - Sid: PassRolesToEcs  #hand roles to ecs not anythin else
                Effect: Allow
                Action: "iam:PassRole"
                Resource: "*"
                Condition:
                  StringEqualsIfExists:
                    "iam:PassedToService": "ecs-tasks.amazonaws.com"

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline"
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:  
        - Name: Source
          Actions:
            - Name: ImageSource  #parallel action
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: "1"
              Configuration:
                RepositoryName: !Ref EcrRepositoryName
                ImageTag: !Ref DeployedImageTag
              OutputArtifacts:
                - Name: ImageDetail   #produced artifact
              RunOrder: 1
            - Name: DeployTemplatesSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket: !Ref ArtifactBucket #read deploy-tempales.zip from artifact bucket
                S3ObjectKey: !Ref DeployTemplatesS3Key
                PollForSourceChanges: "false"  #never self trigger deployment
              OutputArtifacts:
                - Name: DeployTemplates
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              InputArtifacts:
                - Name: ImageDetail
                - Name: DeployTemplates
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: DeployTemplates
                TaskDefinitionTemplatePath: !Sub "${DeployTemplatesPath}/taskdef.json" #read from zip and substitutes the real image URI for the Image placeholder
                AppSpecTemplateArtifact: DeployTemplates
                AppSpecTemplatePath: !Sub "${DeployTemplatesPath}/appspec.yaml"
                Image1ArtifactName: ImageDetail
                Image1ContainerName: IMAGE1_NAME
              RunOrder: 1

  EventBridgeInvokePipelineRole:
    Type: AWS::IAM::Role  #assume to call code pipeline: startpipelinee
    Properties:
      RoleName: !Sub "${ProjectName}-eventbridge-pipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "codepipeline:StartPipelineExecution"
                Resource: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"

  EcrPushRule:
    Type: AWS::Events::Rule  #trigger for the whole app deployment flow
    Properties:
      Name: !Sub "${ProjectName}-ecr-push-rule"
      Description: !Sub "Starts ${ProjectName}-pipeline whenever a new '${DeployedImageTag}' image is pushed to ECR"
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS  #if not then ignored
          repository-name:
            - !Ref EcrRepositoryName
          image-tag:
            - !Ref DeployedImageTag
      Targets:
        - Id: TriggerCodePipeline
          Arn: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt EventBridgeInvokePipelineRole.Arn

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication
  CodeDeployDeploymentGroupName:
    Value: !Ref CodeDeployDeploymentGroup
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
