AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Public ALB + ECS Fargate service for the Photo Uploader lab. The ECS
  service uses deployment controller CODE_DEPLOY, so CodeDeploy (not ECS
  itself) owns traffic shifting between the "blue" and "green" target
  groups. The task is wired with least-privilege access to the photos S3
  bucket and the RDS-managed DB credential secret.

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EcsTaskSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ContainerPort:
    Type: Number
    Default: 8080
  TestListenerPort:
    Type: Number
    Default: 8081
    Description: >
      Second ALB listener port, used only during a deployment: CodeDeploy
      points it at the "green" (candidate) target group before any prod
      traffic shifts, so http://<alb-dns>:<this-port> serves the new
      version for pre-production validation while the prod listener (80)
      still serves the current "blue" version. Distinct from ContainerPort
      -- this is an ALB listener port, not the container's port.
  RepositoryUri:
    Type: String
    Description: ECR repository URI (from the bootstrap stack -- see bootstrap/00-bootstrap.yaml)
  InitialImageTag:
    Type: String
    Default: "latest"
    Description: >
      Tag in our own ECR repo (RepositoryUri) to deploy on the very first
      CREATE. There's no NAT Gateway or other internet egress in this VPC,
      so a public placeholder image can't be pulled here -- push a real
      image to ECR under this tag BEFORE creating this stack (see
      README's "Full setup order"). Once CodeDeploy performs the first
      real blue/green release, it owns the running task definition --
      this parameter no longer matters until the next full CREATE.
  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024"]
  TaskMemory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]
  MinTasks:
    Type: Number
    Default: 1
  DesiredTasks:
    Type: Number
    Default: 1
  MaxTasks:
    Type: Number
    Default: 4
  CpuTargetPercent:
    Type: Number
    Default: 60
    Description: Target average CPU utilization (%) for the scaling policy
  AppOwnerName:
    Type: String
    Description: Full name displayed in the app footer
  LabName:
    Type: String
    Default: "Photo Uploader Lab"
  PhotosBucketName:
    Type: String
  PhotosBucketArn:
    Type: String
  CloudFrontDomainName:
    Type: String
  DbEndpointAddress:
    Type: String
  DbPort:
    Type: String
  DbName:
    Type: String
  DbSecretArn:
    Type: String
    Description: RDS-managed Secrets Manager secret ARN holding {username, password}

Resources:

  # ------------------------------- ALB ---------------------------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSecurityGroupId]
      Subnets: !Ref PublicSubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb"

  # Two target groups so CodeDeploy can shift traffic from Blue -> Green
  # (and back, on rollback) without any downtime.
  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-tg-blue"
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      # The app's gallery page at "/" returns 200 when it (and its DB
      # read) is healthy, so a DB outage correctly fails the health check
      # instead of masking it.
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-tg-green"
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup
          # CodeDeploy rewrites this default action's target group during
          # each blue/green deployment -- do not drift-correct manually.

  # Pre-production validation listener. CodeDeploy's TestTrafficRoute
  # (07-cicd-pipeline.yaml) points this at the green target group as soon
  # as the new task set is healthy, BEFORE ProdListener's traffic shifts --
  # combined with DeploymentReadyOption: STOP_DEPLOYMENT there, the
  # deployment then pauses so http://<alb-dns>:${TestListenerPort} can be
  # checked by hand before promoting (or letting it time out and roll
  # back). Same default-action caveat as ProdListener: CodeDeploy rewrites
  # this on every deployment, don't drift-correct manually.
  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !Ref TestListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # ------------------------------- ECS -----------------------------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cluster"

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-app"
      RetentionInDays: 14

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-task-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: PullFromScopedRepo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ecr:GetDownloadUrlForLayer"
                  - "ecr:BatchGetImage"
                  - "ecr:BatchCheckLayerAvailability"
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-app"
              - Effect: Allow
                Action: "ecr:GetAuthorizationToken"
                Resource: "*"
              - Effect: Allow
                Action: "logs:CreateLogStream"
                Resource: !GetAtt AppLogGroup.Arn
              - Effect: Allow
                Action: "logs:PutLogEvents"
                Resource: !Sub "${AppLogGroup.Arn}:*"
              # Lets the ECS agent resolve the DB_USERNAME/DB_PASSWORD
              # `Secrets` entries below from the RDS-managed secret at
              # task startup.
              - Effect: Allow
                Action: "secretsmanager:GetSecretValue"
                Resource: !Ref DbSecretArn

  # Application-level permissions the running container itself needs:
  # read/write its own uploaded objects in the photos bucket. Nothing else.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: PhotosBucketReadWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:GetObject"
                Resource: !Sub "${PhotosBucketArn}/*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-app"
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${ProjectName}-container"
          Image: !Sub "${RepositoryUri}:${InitialImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: APP_OWNER_NAME
              Value: !Ref AppOwnerName
            - Name: LAB_NAME
              Value: !Ref LabName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: PHOTOS_BUCKET_NAME
              Value: !Ref PhotosBucketName
            - Name: CLOUDFRONT_DOMAIN
              Value: !Ref CloudFrontDomainName
            - Name: DB_HOST
              Value: !Ref DbEndpointAddress
            - Name: DB_PORT
              Value: !Ref DbPort
            - Name: DB_NAME
              Value: !Ref DbName
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub "${DbSecretArn}:username::"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${DbSecretArn}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
    # NOTE: CodeDeploy blue/green deployments register a *new* task
    # definition revision on every release. This resource only defines
    # revision 1 (the InitialImageTag image); CloudFormation must NOT try
    # to "correct" the running revision back afterwards, so the ECS
    # service below ignores TaskDefinition changes post-creation.

  EcsService:
    Type: AWS::ECS::Service
    # Because DeploymentController is CODE_DEPLOY, CloudFormation creates
    # the service once and then steps back -- CodeDeploy owns the running
    # task definition + target group wiring from here on.
    Properties:
      ServiceName: !Sub "${ProjectName}-service"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredTasks
      LaunchType: FARGATE
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref EcsTaskSecurityGroupId]
      LoadBalancers:
        - ContainerName: !Sub "${ProjectName}-container"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref BlueTargetGroup
      HealthCheckGracePeriodSeconds: 60
    DependsOn: ProdListener

  # ------------------------- Auto Scaling (1-4, CPU) ----------------------
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub "service/${EcsCluster}/${EcsService.Name}"
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-cpu-target-tracking"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref CpuTargetPercent
        ScaleInCooldown: 120
        ScaleOutCooldown: 60

Outputs:
  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  AlbArn:
    Value: !Ref ApplicationLoadBalancer
  AlbHostedZoneId:
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
  ProdListenerArn:
    Value: !Ref ProdListener
  TestListenerArn:
    Value: !Ref TestListener
  BlueTargetGroupName:
    Value: !GetAtt BlueTargetGroup.TargetGroupName
  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName
  BlueTargetGroupArn:
    Value: !Ref BlueTargetGroup
  GreenTargetGroupArn:
    Value: !Ref GreenTargetGroup
  ClusterName:
    Value: !Ref EcsCluster
  ServiceName:
    Value: !GetAtt EcsService.Name
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  LogGroupName:
    Value: !Ref AppLogGroup
